name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PAUSA: "0"
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Build (arquivos estáticos e migrações)
        run: |
          python manage.py check
          python manage.py collectstatic --no-input
          python manage.py migrate

      - name: Testes de unidade
        run: python manage.py test forum.tests -v 2

      - name: Testes de sistema (E2E com Selenium)
        run: python manage.py test forum.test_e2e -v 2

  deploy:
    name: Deploy no Render
    needs: build-e-testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
