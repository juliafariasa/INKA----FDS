{% extends "forum/base.html" %}

{% block titulo %}Remover do Descarte - INKA{% endblock %}

{% block content %}
<h2>Remover do Descarte</h2>

<div class="caixa">
    <p>Tem certeza que quer remover {{ tipo }} <b>{{ item }}</b>?</p>
    <p>Essa ação não pode ser desfeita.</p>
</div>

<form method="post">
    {% csrf_token %}
    <input type="submit" name="remover" value="Remover">
</form>

<p><a href="{% url 'forum:descarte' %}">Cancelar e voltar ao Descarte</a></p>
{% endblock %}
