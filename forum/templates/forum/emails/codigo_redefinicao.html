<!DOCTYPE html>
<html lang="pt-br">
<body style="margin:0; padding:24px; background-color:#121314; font-family:Arial, Helvetica, sans-serif; color:#F6F6EF;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                       style="max-width:480px; background-color:#223427; border:1px solid #5F7B44; border-radius:12px;">
                    <tr>
                        <td style="padding:28px 32px 8px; font-size:22px; font-weight:bold; letter-spacing:4px; color:#B9D188;">
                            INKA
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px; font-size:16px; line-height:24px;">
                            Use o código abaixo para redefinir a senha da conta do seu estúdio:
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:16px 32px;">
                            <div style="display:inline-block; padding:14px 24px; background-color:#121314; border:1px solid #B9D188; border-radius:8px; font-family:'Courier New', monospace; font-size:34px; font-weight:bold; letter-spacing:10px; color:#B9D188;">
                                {{ codigo }}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px; font-size:14px; line-height:22px;">
                            O código vale por <strong>{{ validade_minutos }} minutos</strong> e só pode ser usado uma vez.
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 28px; font-size:13px; line-height:20px; color:#B9D188;">
                            Se não foi você que pediu, ignore este e-mail. Sua senha continua a mesma.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
